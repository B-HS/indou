name: CI

on:
  push:
    branches: [dev, prod]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [dev, prod]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    # Indou targets macOS 26 (Swift 6.2 / Xcode 26), so it needs a macOS 26
    # runner. Swap to a self-hosted Mac if the hosted macos-26 image is
    # unavailable.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SPM
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test
