<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E72F0"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- back window -->
  <rect x="356" y="270" width="430" height="330" rx="46" fill="#FFFFFF" opacity="0.38"/>

  <!-- front window -->
  <g filter="url(#shadow)">
    <rect x="238" y="404" width="468" height="358" rx="52" fill="#FFFFFF"/>
    <rect x="238" y="404" width="468" height="92" rx="52" fill="#EEF0FF"/>
    <rect x="238" y="452" width="468" height="44" fill="#EEF0FF"/>
    <circle cx="300" cy="450" r="17" fill="#6E72F0"/>
    <circle cx="356" cy="450" r="17" fill="#C7CBFF"/>
    <circle cx="412" cy="450" r="17" fill="#C7CBFF"/>
  </g>
</svg>
